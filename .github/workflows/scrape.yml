name: ShowToShip — Scrape & Enrich

on:
  workflow_dispatch:
    inputs:
      show_name:
        description: "Tradeshow name (must match a record in Supabase)"
        required: true
        type: string
      urls:
        description: "Exhibitor list URLs (one per line)"
        required: true
        type: string
      use_llm:
        description: "LLM extraction (auto: Ollama local, or OpenAI if OPENAI_API_KEY set)"
        default: "false"
        type: choice
        options: ["false", "true"]
      deep_scrape:
        description: "Scrape individual exhibitor profile pages"
        default: "false"
        type: choice
        options: ["false", "true"]
      find_emails:
        description: "Phase 3 — hunt for email addresses"
        default: "true"
        type: choice
        options: ["false", "true"]
      linkedin_enrich:
        description: "Enrich with LinkedIn via Phantombuster"
        default: "false"
        type: choice
        options: ["false", "true"]
      create_release:
        description: "Create release with Excel artifact"
        default: "false"
        type: choice
        options: ["false", "true"]
      job_id:
        description: "Pre-existing scrape job ID (for frontend integration)"
        required: false
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: pip install --upgrade pip wheel setuptools
      - name: Install playwright
        run: pip install playwright
      - name: Install playwright browsers
        run: python -m playwright install --with-deps chromium
      - name: Install lxml build deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-dev libxslt-dev
      - name: Install remaining deps
        run: pip install -r requirements.txt

      - name: Write URLs file
        env:
          # Passed via env, never interpolated into the script body — a URL
          # containing a shell metacharacter or an "EOF" line would otherwise
          # execute as shell in a job that holds the Supabase secrets.
          URLS: ${{ github.event.inputs.urls }}
        run: printenv URLS > /tmp/urls.txt

      - name: Install Ollama (for LLM extraction)
        if: ${{ github.event.inputs.use_llm == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            curl -fsSL https://ollama.com/install.sh | sh
            ollama pull llama3
            ollama serve &>/dev/null &
          fi

      - name: Run scraper + email finder
        env:
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          PHANTOMBUSTER_API_KEY: ${{ secrets.PHANTOMBUSTER_API_KEY }}
          PB_SEARCH_PHANTOM_ID:  ${{ secrets.PB_SEARCH_PHANTOM_ID }}
          PB_PROFILE_PHANTOM_ID: ${{ secrets.PB_PROFILE_PHANTOM_ID }}
          SHOW_NAME:         ${{ github.event.inputs.show_name }}
          JOB_ID:            ${{ github.event.inputs.job_id || '' }}
          GITHUB_RUN_ID:     ${{ github.run_id }}
          USE_LLM:           ${{ github.event.inputs.use_llm }}
          DEEP_SCRAPE:       ${{ github.event.inputs.deep_scrape }}
          FIND_EMAILS:       ${{ github.event.inputs.find_emails }}
          LINKEDIN_ENRICH:   ${{ github.event.inputs.linkedin_enrich }}
        run: |
          set -euo pipefail

          # SAFE is used ONLY for filenames. The show name passed to the
          # pipeline must be the real one, or db_writer creates a second
          # tradeshow row and the leads never join to the show the UI knows.
          SAFE=$(printf '%s' "${SHOW_NAME}" | tr ' ' '_' | tr -cd '[:alnum:]_-')
          [ -n "$SAFE" ] || SAFE="show"
          OUTPUT="${SAFE}_$(date +%Y%m%d_%H%M).xlsx"

          ARGS=(--urls /tmp/urls.txt --out "/tmp/${OUTPUT}" --show-name "${SHOW_NAME}")

          # Plain `[ .. ] && ..` would return non-zero when a toggle is off and
          # `set -e` would abort the step, so every branch is a full `if`.
          if [ "$USE_LLM" = "true" ]; then
            ARGS+=(--llm)
            if [ -z "${OPENAI_API_KEY:-}" ]; then export LLM_PROVIDER="ollama/llama3"; fi
          fi
          if [ "$DEEP_SCRAPE"     = "true" ]; then ARGS+=(--deep);     fi
          if [ "$FIND_EMAILS"     = "true" ]; then ARGS+=(--emails);   fi
          if [ "$LINKEDIN_ENRICH" = "true" ]; then ARGS+=(--linkedin); fi
          if [ -n "$JOB_ID" ];                then ARGS+=(--job-id "$JOB_ID"); fi

          python scraper/run_pipeline.py "${ARGS[@]}"

          echo "OUTPUT_FILE=${OUTPUT}" >> $GITHUB_ENV
          echo "SAFE_NAME=${SAFE}"    >> $GITHUB_ENV

      # Without this, a job that dies before Python runs (a pip failure, a
      # runner timeout) leaves the scrape_jobs row on "pending" forever and the
      # UI can only report a timeout it cannot explain.
      - name: Mark scrape job failed
        if: ${{ failure() && github.event.inputs.job_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          JOB_ID:       ${{ github.event.inputs.job_id }}
          RUN_URL:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/scrape_jobs?id=eq.${JOB_ID}" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"failed\",\"error\":\"Workflow failed — see ${RUN_URL}\",\"completed_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

      - name: Upload Excel artifact
        if: ${{ env.OUTPUT_FILE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SAFE_NAME }}-leads
          path: /tmp/${{ env.OUTPUT_FILE }}
          retention-days: 90
          if-no-files-found: warn

      - name: Create GitHub Release with Excel
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "leads-${{ env.SAFE_NAME }}-${{ github.run_number }}"
          name: "${{ github.event.inputs.show_name }} — Run #${{ github.run_number }}"
          body: |
            ## ShowToShip Results
            **Show:** ${{ github.event.inputs.show_name }}
            **LLM:** ${{ github.event.inputs.use_llm }} | **Deep:** ${{ github.event.inputs.deep_scrape }} | **Emails:** ${{ github.event.inputs.find_emails }} | **LinkedIn:** ${{ github.event.inputs.linkedin_enrich }}

            All leads saved to Supabase database. Download Excel below ⬇️
          files: /tmp/${{ env.OUTPUT_FILE }}
